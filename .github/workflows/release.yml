# Tag v*.*.* -> build ATLAS-Setup-<version>.exe on a clean Windows runner -> GitHub Release.
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version: {description: "version (no v)", required: true, default: "0.0.0-test"}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Version
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"; [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Syntax check (every .py compiles)
        run: python -m compileall -q -x "(\.venv|node_modules)" .
      - name: Unit tests (gate)
        env: {PYTHONIOENCODING: utf-8, CUDA_VISIBLE_DEVICES: "-1"}
        run: |
          python -m pip install -q -r requirements-ci.txt
          python -m unittest discover -s tests
      - name: Dependency vulnerability gate
        # PYSEC-2026-3740 (nltk, no fix released): TransitionParser model-path APIs that
        # ATLAS never calls. Accepted; see SECURITY.md. Any other known CVE fails the build.
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r requirements-public.txt --ignore-vuln PYSEC-2026-3740 --progress-spinner off
      - name: Desktop (npm) vulnerability gate
        # Electron ships inside the installed app, so its CVEs count too.
        shell: bash
        run: cd desktop && npm audit --audit-level=low
      - name: Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: python tools/build_installer.py --version $env:VERSION --ref $env:GITHUB_SHA --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
      - name: Sign installer (Azure Artifact Signing, only if configured)
        # Skipped until the repo has these secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID,
        # AZURE_CLIENT_SECRET, SIGNING_ENDPOINT, SIGNING_ACCOUNT, SIGNING_PROFILE.
        # Unsigned builds still ship; Windows SmartScreen just warns. See docs/SIGNING.md.
        if: env.SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum ATLAS-Setup-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: "ATLAS-Setup-${{ env.VERSION }}", path: "dist/*"}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          NOTES=$(awk "/^## \[?${VERSION}/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          # Publishing a prepared draft also pushes the tag: refresh its .exe instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ATLAS-Setup-*.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/ATLAS-Setup-*.exe dist/SHA256SUMS.txt --title "ATLAS $VERSION" --notes "${NOTES:-See CHANGELOG.md}"
          fi
