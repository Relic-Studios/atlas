# Tag v*.*.* -> build ATLAS-Setup-<version>.exe on a clean Windows runner -> GitHub Release.
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version: {description: "version (no v)", required: true, default: "0.0.0-test"}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        # the installer ships a prebuilt desktop shell: build_installer.py runs npm ci in its staging copy
        with: {node-version: "22"}
      - name: Version
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"; [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Syntax check (every .py compiles)
        run: python -m compileall -q -x "(\.venv|node_modules)" .
      - name: Unit tests (gate)
        env: {PYTHONIOENCODING: utf-8, CUDA_VISIBLE_DEVICES: "-1"}
        run: |
          python -m pip install -q -r requirements-ci.txt
          python -m unittest discover -s tests
      - name: Dependency vulnerability gate
        # Any known CVE fails the build. (PyTorch is pinned by install.ps1, not here; see SECURITY.md.)
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r requirements-public.txt --progress-spinner off
      - name: Desktop (npm) vulnerability gate
        # Electron ships inside the installed app, so its CVEs count too.
        shell: bash
        run: cd desktop && npm audit --audit-level=low
      - name: Inno Setup 6.7.3 (pinned)
        # installer/atlas.iss needs 6.7.3 or later. Chocolatey stops at 6.7.1 and the runner image's own copy varies,
        # so install the official release, checked against its SHA-256, into a folder of its own.
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $sha = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $dir = Join-Path $env:RUNNER_TEMP "InnoSetup"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $got = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "Inno Setup installer SHA-256 mismatch: $got" }
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup install failed (exit $($p.ExitCode))" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        run: python tools/build_installer.py --version $env:VERSION --ref $env:GITHUB_SHA --iscc $env:ISCC
      - name: Sign installer (Azure Artifact Signing, only if configured)
        # Skipped until the repo has these secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID,
        # AZURE_CLIENT_SECRET, SIGNING_ENDPOINT, SIGNING_ACCOUNT, SIGNING_PROFILE.
        # Unsigned builds still ship; Windows SmartScreen just warns. See docs/SIGNING.md.
        if: env.SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum ATLAS-Setup-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: "ATLAS-Setup-${{ env.VERSION }}", path: "dist/*"}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          NOTES=$(awk "/^## \[?${VERSION}/{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          # A prepared/manual release may contain the exact installed-and-tested candidate.
          # Keep those immutable assets; this independent rebuild remains a workflow artifact.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already prepared; preserving its reviewed assets. Rebuild is available in Actions artifacts."
          else
            FLAGS=()
            HEADER=$(grep -m1 -E "^## \\[?${VERSION}([^0-9.]|$)" CHANGELOG.md || true)
            if [[ "$VERSION" == *-* ]] || echo "$HEADER" | grep -Eqi 'beta|alpha|preview'; then FLAGS+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" dist/ATLAS-Setup-*.exe dist/SHA256SUMS.txt --title "ATLAS $VERSION" --notes "${NOTES:-See CHANGELOG.md}" "${FLAGS[@]}"
          fi
