# Unit tests on every push and pull request (Windows + Linux, no GPU, no models).
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install system audio lib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1
      - run: python -m pip install -q -r requirements-ci.txt
      - name: Unit tests
        env: {PYTHONIOENCODING: utf-8, CUDA_VISIBLE_DEVICES: "-1"}
        run: python -m unittest discover -s tests -v
