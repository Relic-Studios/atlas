<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS: voice agents that join your calls and run on your own PC</title>
<meta name="description" content="ATLAS adds a talking AI to your group voice calls. It hears everyone, learns names, answers when spoken to and stays quiet when it isn't. Local-first, no account, no hidden keys.">
<meta property="og:title" content="ATLAS: voice agents for your calls, running on your PC">
<meta property="og:description" content="Give it a voice and a personality. It joins the call, knows when it's being talked to, and remembers what matters. Local-first and open source.">
<meta property="og:image" content="https://relic-studios.github.io/atlas/img/social-preview.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://relic-studios.github.io/atlas/">

<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="twitter:card" content="summary_large_image">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root{--bg:#05080f;--panel:#0b1220;--line:#1a2740;--fg:#e8eef8;--mute:#93a3bd;--cyan:#38d6ff;--amber:#ffb547}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--cyan)}img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:5;background:rgba(5,8,15,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:24px;height:60px}
nav b{letter-spacing:.18em;font-size:18px}nav .sp{flex:1}
nav a{color:var(--mute);text-decoration:none;font-size:14px}nav a:hover{color:var(--fg)}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--fg)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),#2b8cff);color:#021018;border:0}
.hero{position:relative;min-height:min(78vh,760px);display:flex;align-items:flex-end;overflow:hidden}
.hero picture,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,15,.15) 0%,rgba(5,8,15,.55) 55%,var(--bg) 100%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:72px}
h1{font-size:clamp(36px,5.4vw,64px);line-height:1.05;margin:0 0 18px;max-width:14em}
.lede{font-size:clamp(17px,2vw,21px);color:#c9d5e8;max-width:38em;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}.fine{color:var(--mute);font-size:13px;margin-top:14px}
section{padding:88px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,3.2vw,38px);margin:0 0 14px}
.kicker{color:var(--amber);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.split.rev>:first-child{order:2}
.split img{border-radius:16px;border:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:36px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.step::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(56,214,255,.12);color:var(--cyan);font-weight:700;margin-bottom:10px}
.step h3{margin:0 0 6px;font-size:18px}.step p{margin:0;color:var(--mute);font-size:15px}
table{width:100%;border-collapse:collapse;margin-top:24px;font-size:15px}
td,th{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}td:last-child{color:var(--mute)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--mute);font-size:15px}
footer{padding:40px 0;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
@media(max-width:860px){.split,.steps,.grid3{grid-template-columns:1fr}.split.rev>:first-child{order:0}nav a.hide{display:none}}
</style>
</head>
<body><main style="max-width:640px;margin:18vh auto;padding:0 24px;text-align:center"><h1>Not here</h1><p>That page doesn't exist.</p><p><a href="/atlas/">Back to ATLAS</a></p></main></body></html>
